<section class="view" id="settings">
  <div class="title-row">
    <div>
      <div class="eyebrow">Runtime</div>
      <h2>System settings</h2>
      <p class="sub">All runtime fields are editable. Saving updates the live process, local keys store, and project .env.</p>
    </div>
  </div>
  <div id="settingsTabs" class="actions" style="margin-bottom:16px"></div>
  <article class="card">
    <div id="settingsForm" class="form-grid"></div>
    <div class="actions" style="margin-top:18px">
      <button class="primary" id="saveSettings">Save settings</button>
      <button id="testProvider">Test provider</button>
      <span id="providerStatus" class="tag">Not tested</span>
    </div>
    <p class="note" id="settingsNote"></p>
  </article>
</section>
