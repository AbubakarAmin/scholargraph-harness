<section class="view" id="activity">
  <div class="title-row">
    <div>
      <div class="eyebrow">Telemetry</div>
      <h2>Activity and scratchpad</h2>
      <p class="sub">Recent events and agent notes for the selected run.</p>
    </div>
  </div>
  <div class="grid">
    <article class="card span-7">
      <div class="card-head"><h3>Event stream</h3><span class="tag">tail</span></div>
      <div id="eventStream" class="scroll-lg"></div>
    </article>
    <article class="card span-5">
      <div class="card-head"><h3>Scratchpad</h3><span class="tag">notes</span></div>
      <div id="scratchpad" class="scroll-lg mono"></div>
    </article>
    <article class="card span-6">
      <div class="card-head"><h3>Cross-run lessons</h3><span class="tag">memory</span></div>
      <div id="crossRun"></div>
    </article>
    <article class="card span-6">
      <div class="card-head"><h3>Debate / supervisor</h3><span class="tag">signals</span></div>
      <div id="debateSnap"></div>
    </article>
  </div>
</section>
